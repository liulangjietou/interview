<text x="215.0" y="441.0" text-anchor="middle" font-size="14" fill="#4b5563" font-weight="bold">4</text>
<path d="M151.9,407.4 A165,165 0 0,1 62.6,318.1 L157.7,278.7 A62,62 0 0,0 191.3,312.3 z" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
<text x="87.0" y="388.0" text-anchor="middle" font-size="14" fill="#4b5563" font-weight="bold">5</text>
<path d="M62.6,318.1 A165,165 0 0,1 62.6,191.9 L157.7,231.3 A62,62 0 0,0 157.7,278.7 z" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
<text x="34.0" y="260.0" text-anchor="middle" font-size="14" fill="#4b5563" font-weight="bold">6</text>
<rect x="55.5" y="245.0" width="92" height="20" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
<text x="101.5" y="259.5" text-anchor="middle" font-size="12" fill="#92400e">C · rounds=0</text>
<path d="M62.6,191.9 A165,165 0 0,1 151.9,102.6 L191.3,197.7 A62,62 0 0,0 157.7,231.3 z" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
<text x="87.0" y="132.0" text-anchor="middle" font-size="14" fill="#4b5563" font-weight="bold">7</text>
<line x1="215" y1="255" x2="215.0" y2="128.0" stroke="#dc2626" stroke-width="3" marker-end="url(#arr)"/>
<circle cx="215" cy="255" r="5" fill="#dc2626"/>
<text x="215" y="279" text-anchor="middle" font-size="11" fill="#dc2626">当前 tick = 0</text>
<text x="215" y="465" text-anchor="middle" font-size="13" fill="#374151">指针顺时针转动：每 100 ms 前进一格，转一圈 800 ms</text>
<text x="430" y="78" font-size="14" fill="#111827" font-weight="bold">任务放在哪一格？</text>
<text x="430" y="106" font-size="13" fill="#4b5563" font-weight="bold">任务</text>
<text x="480" y="106" font-size="13" fill="#4b5563" font-weight="bold">延迟</text>
<text x="545" y="106" font-size="13" fill="#4b5563" font-weight="bold">到期 tick</text>
<text x="625" y="106" font-size="13" fill="#4b5563" font-weight="bold">格子</text>
<text x="680" y="106" font-size="13" fill="#4b5563" font-weight="bold">rounds</text>
<line x1="430" y1="114" x2="740" y2="114" stroke="#d1d5db"/>
<text x="430" y="132" font-size="13" fill="#111827">A</text>
<text x="480" y="132" font-size="13" fill="#111827">300 ms</text>
<text x="545" y="132" font-size="13" fill="#111827">3</text>
<text x="625" y="132" font-size="13" fill="#111827">3</text>
<text x="680" y="132" font-size="13" fill="#111827">0</text>
<text x="430" y="158" font-size="13" fill="#111827">B</text>
<text x="480" y="158" font-size="13" fill="#111827">1100 ms</text>
<text x="545" y="158" font-size="13" fill="#111827">11</text>
<text x="625" y="158" font-size="13" fill="#111827">3</text>
<text x="680" y="158" font-size="13" fill="#111827">1</text>
<text x="430" y="184" font-size="13" fill="#111827">C</text>
<text x="480" y="184" font-size="13" fill="#111827">600 ms</text>
<text x="545" y="184" font-size="13" fill="#111827">6</text>
<text x="625" y="184" font-size="13" fill="#111827">6</text>
<text x="680" y="184" font-size="13" fill="#111827">0</text>
<text x="430" y="210" font-size="13" fill="#111827">D</text>
<text x="480" y="210" font-size="13" fill="#111827">2500 ms</text>
<text x="545" y="210" font-size="13" fill="#111827">25</text>
<text x="625" y="210" font-size="13" fill="#111827">1</text>
<text x="680" y="210" font-size="13" fill="#111827">3</text>
<text x="430" y="240" font-size="13" fill="#374151">到期 tick = 当前 tick + 延迟 ÷ 100 ms</text>
<text x="430" y="262" font-size="13" fill="#374151">格子 = 到期 tick % 8（Netty 用位运算 &amp; 7）</text>
<text x="430" y="284" font-size="13" fill="#374151">rounds = (到期 tick − 当前 tick) ÷ 8</text>
<text x="430" y="328" font-size="13" fill="#111827">指针每到一格，遍历这一格的任务链表：</text>
<text x="430" y="350" font-size="13" fill="#111827">· rounds = 0：已到期，执行</text>
<text x="430" y="372" font-size="13" fill="#111827">· rounds > 0：rounds 减 1，等下一圈</text>
<text x="430" y="416" font-size="13" fill="#92400e">A、B 都在 3 号格：A 在第 1 圈执行，B 在第 2 圈执行</text>
</svg>