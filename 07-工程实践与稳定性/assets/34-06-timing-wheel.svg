<path d="M367.4,318.1 A165,165 0 0,1 278.1,407.4 L238.7,312.3 A62,62 0 0,0 272.3,278.7 z" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
<text x="343.0" y="388.0" text-anchor="middle" font-size="14" fill="#4b5563" font-weight="bold">3</text>
<rect x="249.3" y="313.3" width="92" height="20" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
<text x="295.3" y="327.8" text-anchor="middle" font-size="12" fill="#92400e">A · rounds=0</text>
