<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="560" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">ConcurrentHashMap 多线程协作扩容（n = 64 → 128，stride = 16）</text>

  <!-- 旧表 -->
  <text x="40" y="92" font-size="15" font-weight="bold" fill="#111827">旧表 table（n = 64）</text>

  <rect x="40" y="105" width="200" height="80" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="140" y="140" text-anchor="middle" font-size="14" fill="#374151">桶 0 ~ 15</text>
  <text x="140" y="162" text-anchor="middle" font-size="13" fill="#6b7280">待领取</text>

  <rect x="240" y="105" width="200" height="80" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="340" y="140" text-anchor="middle" font-size="14" fill="#374151">桶 16 ~ 31</text>
  <text x="340" y="162" text-anchor="middle" font-size="13" fill="#6b7280">待领取</text>

  <rect x="440" y="105" width="200" height="80" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="540" y="128" text-anchor="middle" font-size="14" fill="#1e3a8a">桶 32 ~ 47（线程 T2 领取）</text>
  <rect x="452" y="140" width="80" height="24" fill="#ffffff" stroke="#2563eb"/>
  <text x="492" y="157" text-anchor="middle" font-size="12" fill="#1e3a8a">桶 41 迁移中</text>
  <rect x="540" y="140" width="28" height="24" fill="#e5e7eb" stroke="#6b7280"/>
  <text x="554" y="156" text-anchor="middle" font-size="10" fill="#374151">FWD</text>
  <rect x="572" y="140" width="28" height="24" fill="#e5e7eb" stroke="#6b7280"/>
  <text x="586" y="156" text-anchor="middle" font-size="10" fill="#374151">FWD</text>
  <rect x="604" y="140" width="28" height="24" fill="#e5e7eb" stroke="#6b7280"/>
  <text x="618" y="156" text-anchor="middle" font-size="10" fill="#374151">FWD</text>

  <rect x="640" y="105" width="200" height="80" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="740" y="128" text-anchor="middle" font-size="14" fill="#78350f">桶 48 ~ 63（线程 T1 领取）</text>
  <rect x="652" y="140" width="80" height="24" fill="#ffffff" stroke="#d97706"/>
  <text x="692" y="157" text-anchor="middle" font-size="12" fill="#78350f">桶 50 迁移中</text>
  <rect x="740" y="140" width="28" height="24" fill="#e5e7eb" stroke="#6b7280"/>
  <text x="754" y="156" text-anchor="middle" font-size="10" fill="#374151">FWD</text>
  <rect x="772" y="140" width="28" height="24" fill="#e5e7eb" stroke="#6b7280"/>
  <text x="786" y="156" text-anchor="middle" font-size="10" fill="#374151">FWD</text>
  <rect x="804" y="140" width="28" height="24" fill="#e5e7eb" stroke="#6b7280"/>
  <text x="818" y="156" text-anchor="middle" font-size="10" fill="#374151">FWD</text>

  <!-- transferIndex 指针 -->
  <line x1="440" y1="95" x2="440" y2="215" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="440" y="232" text-anchor="middle" font-size="13" fill="#dc2626">transferIndex = 32：下一个线程从这里向前领取桶 16 ~ 31</text>

  <!-- 新表 -->
  <text x="40" y="282" font-size="15" font-weight="bold" fill="#111827">新表 nextTable（n = 128）</text>
  <rect x="40" y="295" width="420" height="56" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="150" y="328" text-anchor="middle" font-size="14" fill="#064e3b">桶 0 ~ 63（低位区）</text>
  <rect x="500" y="295" width="420" height="56" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="610" y="328" text-anchor="middle" font-size="14" fill="#064e3b">桶 64 ~ 127（高位区）</text>

  <rect x="330" y="311" width="70" height="24" fill="#ffffff" stroke="#059669"/>
  <text x="365" y="328" text-anchor="middle" font-size="12" fill="#064e3b">桶 50</text>
  <rect x="790" y="311" width="70" height="24" fill="#ffffff" stroke="#059669"/>
  <text x="825" y="328" text-anchor="middle" font-size="12" fill="#064e3b">桶 114</text>

  <!-- 拆分箭头 -->
  <line x1="680" y1="166" x2="380" y2="307" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="470" y="258" font-size="12" fill="#374151">低位链：(hash &amp; 64) == 0</text>
  <line x1="705" y1="166" x2="815" y2="307" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="770" y="258" font-size="12" fill="#374151">高位链：(hash &amp; 64) != 0</text>

  <!-- 说明 -->
  <rect x="40" y="380" width="880" height="160" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="60" y="410" font-size="13" fill="#111827">① 每个线程 CAS 修改 transferIndex 领取一段区间（stride 最少 16 个桶），在区间内从高到低逐桶迁移。</text>
  <text x="60" y="440" font-size="13" fill="#111827">② 迁移桶 i 时 synchronized 锁住头节点，按 (hash &amp; n) 拆成两条链：低位链放到 nextTable[i]，高位链放到 nextTable[i + n]。</text>
  <text x="60" y="470" font-size="13" fill="#111827">③ 迁移完的旧桶放入 ForwardingNode（hash = MOVED = -1）：get 遇到它转到 nextTable 查找，put 遇到它先 helpTransfer 一起扩容。</text>
  <text x="60" y="500" font-size="13" fill="#111827">④ 所有区间迁移完后，最后一个退出的线程复查一遍，再把 table 指向 nextTable，sizeCtl 设为新阈值 128 × 0.75 = 96。</text>
  <text x="60" y="526" font-size="12" fill="#6b7280">图中桶号仅为示意；FWD 表示已迁移完成、放入了 ForwardingNode 的旧桶。</text>
</svg>
