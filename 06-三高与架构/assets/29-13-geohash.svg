<text x="80.0" y="494.5" text-anchor="start" font-size="13" fill="#111827">· A 和 B 只相距约 108 米，但 B 落在东边的格子里，GeoHash 前缀不同。</text>
<text x="80.0" y="520.5" text-anchor="start" font-size="13" fill="#111827">· A 和 C 在同一个格子（前缀相同），却相距约 787 米。</text>
<text x="80.0" y="546.5" text-anchor="start" font-size="13" fill="#111827">· 所以"前缀相同 = 距离近"并不总成立：要查中心格子 + 周围 8 个格子，再精确计算距离过滤。</text>
<text x="80.0" y="572.5" text-anchor="start" font-size="13" fill="#111827">· 每个格子约 938 米 × 607 米；格子的短边不小于搜索半径时，九宫格才能覆盖整个圆。</text>
