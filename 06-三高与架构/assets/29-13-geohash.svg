<text x="454.0" y="262.8" text-anchor="end" font-size="13" fill="#2563eb" font-weight="bold">A 查询者</text>
<circle cx="486.0" cy="264.3" r="6" fill="#16a34a"/>
<text x="496.0" y="269.3" text-anchor="start" font-size="13" fill="#16a34a" font-weight="bold">B</text>
