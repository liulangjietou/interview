<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="470" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">InnoDB 聚簇索引（B+ 树）示意</text>

  <!-- 层级标签 -->
  <text x="10" y="92" font-size="11" fill="#6b7280">根节点</text>
  <text x="10" y="196" font-size="11" fill="#6b7280">非叶子节点</text>
  <text x="10" y="300" font-size="11" fill="#6b7280">叶子节点</text>

  <!-- 根节点 -->
  <rect x="330" y="65" width="240" height="44" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="410" y1="65" x2="410" y2="109" stroke="#2563eb"/>
  <line x1="490" y1="65" x2="490" y2="109" stroke="#2563eb"/>
  <text x="370" y="92" text-anchor="middle" font-size="14" fill="#1e3a8a">1</text>
  <text x="450" y="92" text-anchor="middle" font-size="14" fill="#1e3a8a">100</text>
  <text x="530" y="92" text-anchor="middle" font-size="14" fill="#1e3a8a">200</text>

  <!-- 非叶子节点 -->
  <rect x="90" y="170" width="200" height="44" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="190" y1="170" x2="190" y2="214" stroke="#2563eb"/>
  <text x="140" y="197" text-anchor="middle" font-size="14" fill="#1e3a8a">1</text>
  <text x="240" y="197" text-anchor="middle" font-size="14" fill="#1e3a8a">50</text>

  <rect x="350" y="170" width="200" height="44" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="450" y1="170" x2="450" y2="214" stroke="#2563eb"/>
  <text x="400" y="197" text-anchor="middle" font-size="14" fill="#1e3a8a">100</text>
  <text x="500" y="197" text-anchor="middle" font-size="14" fill="#1e3a8a">150</text>

  <rect x="610" y="170" width="200" height="44" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="710" y1="170" x2="710" y2="214" stroke="#2563eb"/>
  <text x="660" y="197" text-anchor="middle" font-size="14" fill="#1e3a8a">200</text>
  <text x="760" y="197" text-anchor="middle" font-size="14" fill="#1e3a8a">250</text>

  <!-- 根 -> 非叶子 -->
  <line x1="370" y1="109" x2="190" y2="168" stroke="#374151" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="450" y1="109" x2="450" y2="168" stroke="#374151" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="530" y1="109" x2="710" y2="168" stroke="#374151" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- 叶子节点 -->
  <g font-size="12" text-anchor="middle">
    <rect x="70" y="275" width="110" height="56" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
    <text x="125" y="298" fill="#064e3b">id 1 ~ 49</text>
    <text x="125" y="318" fill="#064e3b">完整行数据</text>

    <rect x="200" y="275" width="110" height="56" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
    <text x="255" y="298" fill="#064e3b">id 50 ~ 99</text>
    <text x="255" y="318" fill="#064e3b">完整行数据</text>

    <rect x="330" y="275" width="110" height="56" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
    <text x="385" y="298" fill="#064e3b">id 100 ~ 149</text>
    <text x="385" y="318" fill="#064e3b">完整行数据</text>

    <rect x="460" y="275" width="110" height="56" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
    <text x="515" y="298" fill="#064e3b">id 150 ~ 199</text>
    <text x="515" y="318" fill="#064e3b">完整行数据</text>

    <rect x="590" y="275" width="110" height="56" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
    <text x="645" y="298" fill="#064e3b">id 200 ~ 249</text>
    <text x="645" y="318" fill="#064e3b">完整行数据</text>

    <rect x="720" y="275" width="110" height="56" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
    <text x="775" y="298" fill="#064e3b">id 250 ~ 299</text>
    <text x="775" y="318" fill="#064e3b">完整行数据</text>
  </g>

  <!-- 非叶子 -> 叶子 -->
  <line x1="140" y1="214" x2="125" y2="273" stroke="#374151" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="240" y1="214" x2="255" y2="273" stroke="#374151" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="400" y1="214" x2="385" y2="273" stroke="#374151" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="500" y1="214" x2="515" y2="273" stroke="#374151" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="660" y1="214" x2="645" y2="273" stroke="#374151" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="760" y1="214" x2="775" y2="273" stroke="#374151" stroke-width="1.2" marker-end="url(#a)"/>

  <!-- 叶子之间的双向链表 -->
  <g font-size="15" fill="#059669" text-anchor="middle">
    <text x="190" y="308">⇄</text>
    <text x="320" y="308">⇄</text>
    <text x="450" y="308">⇄</text>
    <text x="580" y="308">⇄</text>
    <text x="710" y="308">⇄</text>
  </g>
  <text x="450" y="352" text-anchor="middle" font-size="12" fill="#059669">叶子节点之间用双向链表相连：范围查询定位起点后顺序遍历即可</text>

  <!-- 说明 -->
  <rect x="40" y="372" width="820" height="84" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="60" y="398" font-size="13" fill="#111827">· 每个节点是一个数据页（默认 16 KB）。非叶子节点只存"主键 + 页指针"，约 14 字节一项，一页约能放 1170 项。</text>
  <text x="60" y="422" font-size="13" fill="#111827">· 叶子节点存完整的行。若一行约 1 KB，一页约放 16 行；三层约可容纳 1170 × 1170 × 16 ≈ 2190 万行（估算值）。</text>
  <text x="60" y="446" font-size="13" fill="#111827">· 一次等值查询从根走到叶子，三层只需三次页访问，根和非叶子节点通常常驻 Buffer Pool，实际磁盘 IO 更少。</text>
</svg>
