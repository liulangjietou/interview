<text x="20" y="373" text-anchor="start" font-size="13" fill="#374151">ConsumeQueue 条目结构：定长 20 字节，位点 n 的条目就在文件第 n × 20 字节处，可以直接定位</text>
<rect x="20" y="385" width="260" height="36" rx="0" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="150.0" y="408" text-anchor="middle" font-size="13" fill="#111827">CommitLog 物理偏移（8 字节）</text>
<rect x="280" y="385" width="170" height="36" rx="0" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="365.0" y="408" text-anchor="middle" font-size="13" fill="#111827">消息大小（4 字节）</text>
<rect x="450" y="385" width="220" height="36" rx="0" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="560.0" y="408" text-anchor="middle" font-size="13" fill="#111827">Tag 哈希码（8 字节）</text>
<text x="20" y="452" text-anchor="start" font-size="12" fill="#6b7280">CommitLog 单个文件 1 GB，文件名是这个文件的起始物理偏移，例如 00000000000000000000、00000000001073741824。</text>
<text x="20" y="474" text-anchor="start" font-size="12" fill="#6b7280">IndexFile 是另一份哈希索引，支持按消息 Key 查询。ConsumeQueue 和 IndexFile 都由后台线程从 CommitLog 异步构建。图中偏移为示例值。</text>
